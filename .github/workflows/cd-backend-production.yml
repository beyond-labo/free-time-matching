name: Backend CD (production)

on:
  push:
    tags:
      - "backend-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release ref
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.release-ref.outputs.commit_sha }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release ref
        id: release-ref
        shell: bash
        run: |
          set -euo pipefail

          main_ref="refs/remotes/origin/main"
          if ! git rev-parse --verify "${main_ref}^{commit}" >/dev/null 2>&1; then
            echo "origin/main is not available in the checkout" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              echo "workflow_dispatch is only allowed from main" >&2
              exit 1
            fi
            commit_sha="$(git rev-parse HEAD^{commit})"
            main_sha="$(git rev-parse "${main_ref}^{commit}")"
            if [[ "$commit_sha" != "$main_sha" ]]; then
              echo "manual run is not pointing at the current main commit" >&2
              exit 1
            fi
          else
            tag_name="${GITHUB_REF_NAME}"
            if [[ ! "$tag_name" =~ ^backend-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "tag must match backend-vX.Y.Z: $tag_name" >&2
              exit 1
            fi
            tag_ref="refs/tags/${tag_name}"
            if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
              echo "release tag must be annotated: $tag_name" >&2
              exit 1
            fi
            commit_sha="$(git rev-parse "${tag_ref}^{commit}")"
            if ! git merge-base --is-ancestor "$commit_sha" "${main_ref}^{commit}"; then
              echo "tag commit is not contained in origin/main: $commit_sha" >&2
              exit 1
            fi
          fi

          echo "commit_sha=$commit_sha" >>"$GITHUB_OUTPUT"
          {
            echo "### Release preflight"
            echo "- Commit: \\`${commit_sha}\\`"
            echo "- Ref: ${GITHUB_REF}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >>"$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify backend and Cloudflare configuration
    needs: preflight
    uses: ./.github/workflows/ci-backend.yml
    permissions:
      contents: read

  verify-supabase:
    name: Verify Supabase migrations and RLS
    needs: preflight
    uses: ./.github/workflows/ci-supabase.yml
    permissions:
      contents: read

  production-plan:
    name: Production Terraform preflight plan
    needs:
      - preflight
      - verify
      - verify-supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-plan
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.1

      - name: Initialize Terraform remote state
        working-directory: infra/cloudflare/environments/production
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        run: bash ../../../../scripts/terraform/init-r2-backend.sh production "$PWD"

      - name: Create read-only Terraform plan summary
        working-directory: infra/cloudflare/environments/production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        run: |
          set +e
          plan_log="$RUNNER_TEMP/production-preflight-plan.txt"
          terraform plan -lock=false -detailed-exitcode -input=false -no-color >"$plan_log" 2>&1
          plan_status=$?
          set -e

          if [[ "$plan_status" -ne 0 && "$plan_status" -ne 2 ]]; then
            echo "Terraform preflight plan failed" >&2
            exit "$plan_status"
          fi

          summary="$(grep -E '^(No changes\.|Plan:)' "$plan_log" | tail -n 1 || true)"
          if [[ -z "$summary" ]]; then
            summary="Terraform plan completed without a concise summary line."
          fi
          {
            echo "### Production Terraform preflight"
            echo "- Commit: \\`${{ needs.preflight.outputs.commit_sha }}\\`"
            echo "- Result: ${summary}"
            echo "- Plan details remain on the ephemeral runner and are not uploaded."
          } >>"$GITHUB_STEP_SUMMARY"

  apply-and-deploy:
    name: Apply and deploy production
    needs:
      - preflight
      - verify
      - verify-supabase
      - production-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Terraform remote state
        working-directory: infra/cloudflare/environments/production
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        run: bash ../../../../scripts/terraform/init-r2-backend.sh production "$PWD"

      - name: Recalculate and apply Terraform changes
        working-directory: infra/cloudflare/environments/production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WRITE }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        run: |
          set +e
          plan_file="$RUNNER_TEMP/production.tfplan"
          plan_log="$RUNNER_TEMP/production-plan.txt"
          terraform plan -lock=false -input=false -no-color -out="$plan_file" >"$plan_log" 2>&1
          plan_status=$?
          set -e

          if [[ "$plan_status" -ne 0 ]]; then
            echo "Terraform production plan failed; details remain on the ephemeral runner." >&2
            exit "$plan_status"
          fi

          summary="$(grep -E '^(No changes\.|Plan:)' "$plan_log" | tail -n 1 || true)"
          if [[ -z "$summary" ]]; then
            summary="Terraform plan completed without a concise summary line."
          fi
          {
            echo "### Production Terraform apply"
            echo "- Recalculated plan: ${summary}"
            echo "- Plan details remain on the ephemeral runner and are not uploaded."
          } >>"$GITHUB_STEP_SUMMARY"

          set +e
          apply_log="$RUNNER_TEMP/production-apply.txt"
          terraform apply -lock=false -input=false -no-color -auto-approve \
            "$plan_file" >"$apply_log" 2>&1
          apply_status=$?
          set -e

          if [[ "$apply_status" -ne 0 ]]; then
            echo "Terraform production apply failed; details remain on the ephemeral runner." >&2
            exit "$apply_status"
          fi
          echo "- Terraform apply: succeeded" >>"$GITHUB_STEP_SUMMARY"

      - name: Apply Supabase migrations to production
        id: database-migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production Supabase setting is missing: ${name}" >&2
              exit 1
            fi
          done
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --dry-run --skip-vault
          supabase db push --linked --skip-vault --yes
          supabase migration list --linked
          echo "### Production Supabase migration" >>"$GITHUB_STEP_SUMMARY"
          echo "- Project ref: \`${SUPABASE_PROJECT_REF}\`" >>"$GITHUB_STEP_SUMMARY"
          echo "- Migration: applied and linked history verified" >>"$GITHUB_STEP_SUMMARY"

      - name: Deploy Worker to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WRITE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          ACCOUNT_DELETION_STATUS_SECRET: ${{ secrets.ACCOUNT_DELETION_STATUS_SECRET }}
        run: |
          set -euo pipefail
          required=(
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            APPLE_CLIENT_ID
            SUPABASE_SECRET_KEY
            APPLE_TEAM_ID
            APPLE_KEY_ID
            APPLE_PRIVATE_KEY
            ACCOUNT_DELETION_STATUS_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production Worker setting is missing: ${name}" >&2
              exit 1
            fi
          done

          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n '{
            SUPABASE_SECRET_KEY: env.SUPABASE_SECRET_KEY,
            APPLE_TEAM_ID: env.APPLE_TEAM_ID,
            APPLE_KEY_ID: env.APPLE_KEY_ID,
            APPLE_PRIVATE_KEY: env.APPLE_PRIVATE_KEY,
            ACCOUNT_DELETION_STATUS_SECRET: env.ACCOUNT_DELETION_STATUS_SECRET
          }' >"$secrets_file"
          chmod 600 "$secrets_file"

          deployment_output="$RUNNER_TEMP/wrangler-production-deploy.txt"
          pnpm --dir apps/backend exec wrangler deploy --env production \
            --var "SUPABASE_URL:${SUPABASE_URL}" \
            --var "SUPABASE_PUBLISHABLE_KEY:${SUPABASE_PUBLISHABLE_KEY}" \
            --var "APPLE_CLIENT_ID:${APPLE_CLIENT_ID}" \
            --secrets-file "$secrets_file" >"$deployment_output"
          cat "$deployment_output"
          deployment_id="$(sed -nE 's/.*(Current Version ID|Version ID):[[:space:]]*([^[:space:]]+).*/\2/p' "$deployment_output" | tail -n 1)"
          {
            echo "### Production deployment"
            echo "- Commit: \\`${{ needs.preflight.outputs.commit_sha }}\\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Actor: ${GITHUB_ACTOR}"
            if [[ -n "$deployment_id" ]]; then
              echo "- Worker version: \\`${deployment_id}\\`"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Smoke test production health endpoint
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
          BACKEND_HEALTH_TIMEOUT_MS: "5000"
          BACKEND_HEALTH_MAX_ATTEMPTS: "12"
          BACKEND_HEALTH_RETRY_DELAY_MS: "5000"
        run: node scripts/backend/smoke-health.mjs

      - name: Record production smoke result
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          {
            echo "- Health URL: ${BACKEND_HEALTH_URL}/healthz"
            echo "- Smoke: passed"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Record partial release recovery
        if: ${{ failure() && steps.database-migration.outcome != 'skipped' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set +e
          {
            echo "### Partial release requires attention"
            echo "- Database migration started, or completed before a later step failed."
            echo "- Do not edit or remove an applied migration. Inspect the linked history below before retrying."
          } >>"$GITHUB_STEP_SUMMARY"

          migration_log="$RUNNER_TEMP/production-migration-recovery.txt"
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" && -n "${SUPABASE_DB_PASSWORD:-}" && -n "${SUPABASE_PROJECT_REF:-}" ]] && \
            supabase link --project-ref "$SUPABASE_PROJECT_REF" >/dev/null 2>&1 && \
            supabase migration list --linked >"$migration_log" 2>&1; then
            {
              echo "#### Linked migration history"
              echo '```text'
              cat "$migration_log"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "- Linked migration history could not be retrieved; inspect Supabase Dashboard before retrying." >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "- Restore compatibility with a corrective migration or rerun this commit after fixing the failed step." >>"$GITHUB_STEP_SUMMARY"
