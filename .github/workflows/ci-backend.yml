name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend and Cloudflare configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate backend Worker types
        run: pnpm --dir apps/backend run types

      - name: Check generated Worker types
        run: git diff --exit-code -- apps/backend/worker-configuration.d.ts

      - name: Typecheck backend
        run: pnpm --dir apps/backend run typecheck

      - name: Run Workers Runtime tests
        run: pnpm --dir apps/backend run test

      - name: Build Worker bundle
        run: pnpm --dir apps/backend run build

      - name: Validate Terraform configuration
        shell: bash
        run: |
          set -euo pipefail
          for provider in cloudflare supabase; do
            for environment in staging production; do
              root="infra/${provider}/environments/${environment}"
              terraform -chdir="${root}" fmt -check -recursive
              terraform -chdir="${root}" init -backend=false -input=false -no-color
              terraform -chdir="${root}" validate -no-color
            done
          done
