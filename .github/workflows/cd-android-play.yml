name: Android Google Play

on:
  push:
    tags:
      - android-v*
  workflow_dispatch:
    inputs:
      version_name:
        description: App version in X.Y.Z format
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build and test
        run: bash scripts/android/test.sh

  release:
    name: Upload to Google Play internal track
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play-internal
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version_name }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${REF_NAME#android-v}"
          else
            version="$DISPATCH_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z format." >&2
            exit 1
          fi
          version_code=$((RUN_NUMBER * 100 + RUN_ATTEMPT))
          echo "ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Build, sign, and upload
        env:
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: bash scripts/android/release.sh
      - name: Preserve uploaded Android App Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Himatch-Android-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: ${{ runner.temp }}/himatch-android-export/*.aab
          if-no-files-found: error
          retention-days: 14
